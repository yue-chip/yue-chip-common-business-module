plugins {
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'application'
}
archivesBaseName = 'yue-chip-common-business-server'
apply plugin: 'org.springframework.boot'
apply from: this.rootProject.file('javaLibrary.gradle')
apply from: this.rootProject.file('javaLibraryMvnPublish.gradle')
configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    testCompileOnly {
        extendsFrom testAnnotationProcessor
    }
}
mainClassName = 'com.yue.chip.common.business.ApplicationCommonBusinessServe'
bootJar {
    enabled true
}
dependencies {
    api project(':interface-expose')
    api ('com.primeton.epas:pas-spring-boot-starter:6.5.1')
    api ('com.primeton.epas:pas-embed-core:6.5.1')
    api ('com.primeton.epas:pas-embed-el:6.5.1')
    api ('com.primeton.epas:pas-embed-websocket:6.5.1')
    api ('com.primeton.epas:pas-spring-websocket-adapter:6.5.1')
    api platform("yue.chip:starter:${yueChipPlatformVersion}"){
        exclude(group:'org.apache.tomcat.embed',module:'tomcat-embed-core')
        exclude(group:'org.apache.tomcat.embed',module:'tomcat-embed-el')
        exclude(group:'org.apache.tomcat.embed',module:'tomcat-embed-websocket')
    }
    api ('yue.chip:yue-chip-serve-starter'){
        exclude(group:'org.apache.tomcat.embed',module:'tomcat-embed-core')
        exclude(group:'org.apache.tomcat.embed',module:'tomcat-embed-el')
        exclude(group:'org.apache.tomcat.embed',module:'tomcat-embed-websocket')
    }
    api ('yue.chip:yue-chip-business-starter'){
        exclude(group:'org.apache.tomcat.embed',module:'tomcat-embed-core')
        exclude(group:'org.apache.tomcat.embed',module:'tomcat-embed-el')
        exclude(group:'org.apache.tomcat.embed',module:'tomcat-embed-websocket')
    }
    api ('yue.chip:yue-chip-security'){
        exclude(group:'org.apache.tomcat.embed',module:'tomcat-embed-core')
        exclude(group:'org.apache.tomcat.embed',module:'tomcat-embed-el')
        exclude(group:'org.apache.tomcat.embed',module:'tomcat-embed-websocket')
    }
    api 'io.minio:minio'
//    api 'com.aliyun:dysmsapi20170525'
    api ('com.aliyun:dyvmsapi20170525') {
        exclude group: "com.sun.xml.bind"
    }
    api 'com.tencentcloudapi:tencentcloud-sdk-java-sms'
    api 'cn.com.kingbase:kingbase8:8.6.0'
    api 'xiao.wei:hibernate:6.2'
    api 'com.sun.messaging.mq:fscontext:4.6-b01'
    implementation('org.springframework.boot:spring-boot-starter-data-jdbc') {
        exclude group: 'org.springframework.data', module: 'spring-data-jdbc'
    }
//    api "yue.chip:yue-chip-oauth2-resource-server"
//    implementation 'org.springframework.boot:spring-boot-devtools'
    testImplementation ('org.springframework.boot:spring-boot-starter-test'){
        exclude(group:'org.apache.tomcat.embed',module:'tomcat-embed-core')
        exclude(group:'org.apache.tomcat.embed',module:'tomcat-embed-el')
        exclude(group:'org.apache.tomcat.embed',module:'tomcat-embed-websocket')
    }
    compileOnly "org.mapstruct:mapstruct"
    compileOnly "org.mapstruct:mapstruct-processor"
    compileOnly "org.mapstruct:mapstruct-jdk8"
    compileOnly "org.projectlombok:lombok"
    compileOnly "org.projectlombok:lombok-mapstruct-binding"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
    testCompileOnly "org.mapstruct:mapstruct-processor:${mapstructVersion}"
    testAnnotationProcessor"org.mapstruct:mapstruct-processor:${mapstructVersion}"
}

