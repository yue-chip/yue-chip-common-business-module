server:
  port: 0
spring:
  main:
    allow-bean-definition-overriding: true
    allow-circular-references: true
  nacos:
    group: YUE-CHI-GROUP
    host: 192.168.177.129:8848
    namespace: 60861075-1051-417c-b85d-70d5f638d719
    username: nacos
    password: nacos
  application:
    name: common
  cloud:
    nacos:
      server-addr: ${spring.nacos.host}
      username: ${spring.nacos.username}
      password: ${spring.nacos.password}
      config:
        namespace: ${spring.nacos.namespace}
        group: ${spring.nacos.group}
  config:
    import:
      - nacos:${spring.application.name}.yaml?group=${spring.nacos.group}&refreshEnabled=true
      - nacos:common.yaml?group=GLOBAL_GROUP&refreshEnabled=true
      - nacos:datasource.yaml?group=GLOBAL_GROUP&refreshEnabled=true
      - nacos:jpa.yaml?group=GLOBAL_GROUP&refreshEnabled=true
      - nacos:oauth2-resource.yaml?group=GLOBAL_GROUP&refreshEnabled=true
      - nacos:sentinel.yaml?group=GLOBAL_GROUP&refreshEnabled=true
      - nacos:dubbo.yaml?group=GLOBAL_GROUP&refreshEnabled=true
      - nacos:seata.yaml?group=GLOBAL_GROUP&refreshEnabled=true
      - nacos:redis.yaml?group=GLOBAL_GROUP&refreshEnabled=true
      - nacos:file.yaml?group=GLOBAL_GROUP&refreshEnabled=true
      - nacos:call.yaml?group=GLOBAL_GROUP&refreshEnabled=true
      - nacos:sms.yaml?group=GLOBAL_GROUP&refreshEnabled=true
